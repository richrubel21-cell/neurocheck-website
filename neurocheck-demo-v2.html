<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="theme-color" content="#ffffff"/>
<title>NeuroCheck AI — Live Webcam Demo</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --teal:#0b8f83;--teal2:#0d9488;--tealL:rgba(11,143,131,.1);--tealM:rgba(11,143,131,.18);
  --red:#dc2626;--redL:rgba(220,38,38,.09);
  --amber:#d97706;--amberL:rgba(217,119,6,.09);
  --green:#16a34a;--greenL:rgba(22,163,74,.09);
  --blue:#2563eb;--blueL:rgba(37,99,235,.09);
  --purple:#7c3aed;--purpleL:rgba(124,58,237,.09);
  --tx:#0f172a;--tx2:#475569;--tx3:#94a3b8;
  --border:#e2e8f0;--surface:#ffffff;--surface2:#f8fafc;
  --f:'Outfit',system-ui,sans-serif;--m:'IBM Plex Mono',monospace;
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);
}
html,body{height:100%;overflow:hidden}
body{font-family:var(--f);background:#080d16;-webkit-font-smoothing:antialiased;touch-action:manipulation}
::-webkit-scrollbar{width:3px}::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:3px}

@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes glow{0%,100%{box-shadow:0 0 20px rgba(11,143,131,.5),0 4px 20px rgba(0,0,0,.3)}50%{box-shadow:0 0 40px rgba(11,143,131,.8),0 4px 24px rgba(0,0,0,.3)}}
@keyframes itemPop{from{opacity:0;transform:translateY(12px) scale(.85)}to{opacity:1;transform:none}}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes sheetDown{from{transform:translateY(0)}to{transform:translateY(110%)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes panelIn{from{opacity:0;transform:scale(.96) translateY(6px)}to{opacity:1;transform:none}}
@keyframes alertPop{0%,100%{box-shadow:0 0 0 0 rgba(220,38,38,.35)}70%{box-shadow:0 0 0 10px rgba(220,38,38,0)}}
@keyframes promptIn{from{opacity:0;transform:translate(-50%,-50%) scale(.94)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}

/* Layout */
.app{position:fixed;inset:0;overflow:hidden;background:#080d16}

/* Topbar */
.topbar{position:absolute;top:0;left:0;right:0;z-index:60;
  height:52px;padding-top:var(--safe-t);
  background:rgba(255,255,255,.93);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-bottom:1px solid rgba(226,232,240,.8);
  display:flex;align-items:center;justify-content:space-between;padding-left:14px;padding-right:14px}
.t-logo{display:flex;align-items:center;gap:8px}
.t-mark{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,#0b8f83,#0d9488);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:14px;color:#fff;box-shadow:0 2px 8px rgba(11,143,131,.35)}
.t-name{font-weight:800;font-size:15px;letter-spacing:-.3px;color:#0f172a}
.t-name span{color:var(--teal)}
.t-right{display:flex;align-items:center;gap:8px}
.t-pill{display:flex;align-items:center;gap:5px;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:600}
.t-pill.live{background:var(--greenL);border:1px solid rgba(22,163,74,.2);color:var(--green)}
.t-pill.ai{background:var(--purpleL);border:1px solid rgba(124,58,237,.15);color:var(--green)}
.t-dot{width:5px;height:5px;border-radius:50%;animation:pulse 1.5s infinite}

/* Canvas */
.canvas-wrap{position:absolute;inset:0}
canvas{width:100%;height:100%;display:block}
.c-grad-top{position:absolute;top:0;left:0;right:0;height:100px;background:linear-gradient(to bottom,rgba(8,13,22,.5),transparent);pointer-events:none}
.c-grad-bot{position:absolute;bottom:0;left:0;right:0;height:200px;background:linear-gradient(to top,rgba(8,13,22,.7),transparent);pointer-events:none}

/* CN Prompt */
.cn-prompt{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  background:rgba(0,0,0,.88);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  padding:18px 28px;border-radius:16px;text-align:center;
  border:1px solid rgba(11,143,131,.5);box-shadow:0 0 40px rgba(11,143,131,.15);
  z-index:55;animation:promptIn .25s cubic-bezier(.22,1,.36,1);min-width:220px}
.cn-prompt h3{font-size:20px;font-weight:800;color:#1de9b6;margin-bottom:4px}
.cn-prompt p{font-size:11px;color:rgba(255,255,255,.6);font-family:var(--m)}

/* Alert strip */
.alert-strip{position:absolute;bottom:calc(100px + var(--safe-b));left:16px;right:86px;
  background:rgba(220,38,38,.12);border:1px solid rgba(220,38,38,.35);
  backdrop-filter:blur(12px);border-radius:12px;padding:10px 14px;
  display:flex;align-items:center;gap:10px;z-index:58;animation:alertPop 2s infinite}
.a-icon{font-size:18px;flex-shrink:0}
.a-title{font-size:12px;font-weight:700;color:#fff}
.a-sub{font-size:10px;color:rgba(255,255,255,.65);margin-top:1px}

/* Cam info */
.cam-info{position:absolute;bottom:calc(68px + var(--safe-b));left:14px;
  display:flex;align-items:center;gap:6px;
  background:rgba(0,0,0,.55);backdrop-filter:blur(8px);
  padding:5px 12px;border-radius:20px;font-family:var(--m);font-size:10px;color:rgba(255,255,255,.65)}

/* FAB */
.fab-wrap{position:absolute;bottom:calc(24px + var(--safe-b));right:20px;z-index:70}
.fab{width:58px;height:58px;border-radius:50%;background:linear-gradient(135deg,#0b8f83,#0d9488);
  border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:22px;font-weight:900;font-family:var(--f);
  animation:glow 2.5s ease-in-out infinite;
  box-shadow:0 4px 20px rgba(0,0,0,.3);transition:transform .15s}
.fab:active{transform:scale(.91)}
.fab-items{position:absolute;bottom:66px;right:0;display:flex;flex-direction:column;align-items:flex-end;gap:9px;pointer-events:none;opacity:0;transition:opacity .18s}
.fab-items.open{pointer-events:auto;opacity:1}
.fab-item{display:flex;align-items:center;gap:10px;opacity:0}
.fab-items.open .fab-item:nth-child(1){animation:itemPop .22s .05s cubic-bezier(.22,1,.36,1) forwards}
.fab-items.open .fab-item:nth-child(2){animation:itemPop .22s .09s cubic-bezier(.22,1,.36,1) forwards}
.fab-items.open .fab-item:nth-child(3){animation:itemPop .22s .13s cubic-bezier(.22,1,.36,1) forwards}
.fab-items.open .fab-item:nth-child(4){animation:itemPop .22s .17s cubic-bezier(.22,1,.36,1) forwards}
.fab-items.open .fab-item:nth-child(5){animation:itemPop .22s .21s cubic-bezier(.22,1,.36,1) forwards}
.fi-label{background:rgba(255,255,255,.95);backdrop-filter:blur(10px);border:1px solid var(--border);border-radius:10px;padding:6px 14px;font-size:12px;font-weight:700;color:var(--tx);box-shadow:0 4px 16px rgba(0,0,0,.1);white-space:nowrap}
.fi-btn{width:44px;height:44px;border-radius:50%;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:19px;box-shadow:0 3px 14px rgba(0,0,0,.15);transition:transform .15s;flex-shrink:0}
.fi-btn:active{transform:scale(.88)}
.fi-btn.alerting{animation:alertPop 2s infinite}

/* Scrim */
.scrim{position:fixed;inset:0;background:rgba(8,13,22,.55);backdrop-filter:blur(2px);z-index:65;animation:fadeIn .2s}

/* Sheet */
.sheet{position:fixed;bottom:0;left:0;right:0;z-index:70;
  background:var(--surface);border-radius:22px 22px 0 0;
  box-shadow:0 -8px 40px rgba(0,0,0,.18);
  max-height:82vh;display:flex;flex-direction:column;
  animation:sheetUp .3s cubic-bezier(.22,1,.36,1);
  padding-bottom:var(--safe-b)}
.sheet.closing{animation:sheetDown .26s cubic-bezier(.36,0,.66,0) forwards}
.sh-handle{width:36px;height:4px;border-radius:2px;background:#cbd5e1;margin:10px auto 0;flex-shrink:0}
.sh-header{padding:14px 18px 12px;border-bottom:1px solid var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:space-between}
.sh-title{display:flex;align-items:center;gap:10px;font-size:17px;font-weight:800;color:var(--tx)}
.sh-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px}
.sh-close{width:30px;height:30px;border-radius:50%;border:1px solid var(--border);background:var(--surface2);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:17px;color:var(--tx2)}
.sh-tabs{display:flex;border-bottom:1px solid var(--border);flex-shrink:0}
.stab{flex:1;padding:11px 6px;font-size:13px;font-weight:600;color:var(--tx3);border:none;background:transparent;cursor:pointer;border-bottom:2.5px solid transparent;font-family:var(--f);transition:all .15s}
.stab.on{color:var(--teal);border-bottom-color:var(--teal)}
.sh-body{overflow-y:auto;-webkit-overflow-scrolling:touch;flex:1;padding:18px}

/* Plain cards */
.pc{display:flex;flex-direction:column;gap:13px}
.pcard{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:15px;border:1px solid transparent}
.pcard.good{background:var(--greenL);border-color:rgba(22,163,74,.18)}
.pcard.warn{background:var(--amberL);border-color:rgba(217,119,6,.18)}
.pcard.alert{background:var(--redL);border-color:rgba(220,38,38,.18)}
.pcard.info{background:var(--blueL);border-color:rgba(37,99,235,.13)}
.pcard.base{background:var(--surface2);border-color:var(--border)}
.p-emoji{font-size:24px;flex-shrink:0;line-height:1.2;margin-top:1px}
.p-ttl{font-size:14px;font-weight:700;color:var(--tx);margin-bottom:3px}
.p-body{font-size:13px;color:var(--tx2);line-height:1.65}
.p-wait{text-align:center;padding:28px 12px;color:var(--tx3)}
.p-wait-icon{font-size:38px;margin-bottom:10px}
.p-wait p{font-size:14px;line-height:1.6}

/* Clinical */
.cc{display:flex;flex-direction:column;gap:11px}
.ccard{background:var(--surface2);border:1px solid var(--border);border-radius:13px;padding:14px}
.cc-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.cc-lbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--tx3)}
.cc-val{font-family:var(--m);font-size:19px;font-weight:700}
.cc-bar{height:4px;border-radius:2px;background:var(--border);overflow:hidden;margin-bottom:9px}
.cc-fill{height:100%;border-radius:2px;transition:width .8s cubic-bezier(.22,1,.36,1)}
.cc-row{display:flex;justify-content:space-between;font-size:12px;padding:4px 0;border-bottom:1px solid var(--border)}
.cc-row:last-child{border:none}
.cc-rl{color:var(--tx2)}.cc-rv{font-family:var(--m);font-weight:600;color:var(--tx)}
.cc-rv.r{color:var(--red)}.cc-rv.a{color:var(--amber)}.cc-rv.g{color:var(--green)}
.cn-pills{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:4px}
.cnp{padding:5px 2px;border-radius:7px;text-align:center;font-family:var(--m);font-size:9px;font-weight:600;transition:all .3s}
.cnp.pass{background:var(--greenL);color:var(--green);border:1px solid rgba(22,163,74,.2)}
.cnp.act{background:var(--amberL);color:var(--amber);border:1px solid rgba(217,119,6,.2);animation:pulse .8s infinite}
.cnp.pend{background:var(--surface);color:var(--tx3);border:1px solid var(--border)}

@media(min-width:768px){
  .sheet{position:fixed;bottom:auto;left:auto;top:50%;right:20px;transform:translateY(-50%);width:400px;max-height:86vh;border-radius:20px;animation:panelIn .25s cubic-bezier(.22,1,.36,1);padding-bottom:0}
  .sheet.closing{animation:none;opacity:0;transition:opacity .2s}
  .fab-wrap{bottom:28px;right:24px}
  .alert-strip{left:80px;right:80px;bottom:108px}
  .cam-info{bottom:72px}
}
</style>
</head>
<body>
<div class="app">
  <!-- Topbar -->
  <div class="topbar">
    <div class="t-logo">
      <div class="t-mark">N</div>
      <div class="t-name">NeuroCheck<span>AI</span></div>
    </div>
    <div class="t-right">
      <div class="t-pill ai"><div class="t-dot" style="background:var(--green)"></div>LIVE WEBCAM</div>
      <div class="t-pill live"><div class="t-dot" style="background:var(--green)"></div>LIVE</div>
    </div>
  </div>

  <!-- Video + overlay canvas -->
  <div class="canvas-wrap">
    <video id="vid" autoplay playsinline muted style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1);display:none"></video>
    <canvas id="c" style="position:absolute;inset:0"></canvas>
    <div class="c-grad-top"></div>
    <div class="c-grad-bot"></div>
    <div id="nocam" style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;text-align:center;padding:24px">
      <div style="font-size:56px">📷</div>
      <div style="font-size:20px;font-weight:800;color:#1de9b6">Live Gait & Facial Analysis</div>
      <div style="font-size:14px;color:rgba(255,255,255,.6);max-width:300px;line-height:1.6">Tap Start Camera to begin real-time CN testing with your own face and body</div>
      <button onclick="startCam()" style="padding:14px 32px;border-radius:12px;background:linear-gradient(135deg,#0b8f83,#0d9488);color:#fff;font-weight:700;font-size:15px;border:none;cursor:pointer;font-family:var(--f);box-shadow:0 6px 24px rgba(11,143,131,.4)">▶ Start Camera</button>
    </div>
  </div>

  <!-- Dynamic overlays injected by JS -->
  <div id="prompt-wrap"></div>
  <div id="alert-wrap"></div>
  <div class="cam-info">
    <div style="width:5px;height:5px;border-radius:50%;background:#4ade80;animation:pulse 1.5s infinite"></div>
    Intel RealSense D435i &nbsp;•&nbsp; 468 landmarks &nbsp;•&nbsp; 30 FPS
  </div>

  <!-- FAB -->
  <div class="fab-wrap" id="fabWrap">
    <div class="fab-items" id="fabItems">
      <div class="fab-item">
        <div class="fi-label">Cranial Nerves</div>
        <button class="fi-btn" style="background:rgba(124,58,237,.12);color:#7c3aed" onclick="openSheet('cn')">👁️</button>
      </div>
      <div class="fab-item">
        <div class="fi-label">GCS Score</div>
        <button class="fi-btn" style="background:rgba(37,99,235,.12);color:#2563eb" onclick="openSheet('gcs')">🧠</button>
      </div>
      <div class="fab-item">
        <div class="fi-label">Delirium</div>
        <button class="fi-btn alerting" id="delBtn" style="background:rgba(220,38,38,.12);color:#dc2626" onclick="openSheet('cam')">🔴</button>
      </div>
      <div class="fab-item">
        <div class="fi-label">Frailty</div>
        <button class="fi-btn" style="background:rgba(217,119,6,.12);color:#d97706" onclick="openSheet('fr')">🦴</button>
      </div>
      <div class="fab-item">
        <div class="fi-label">Patient Info</div>
        <button class="fi-btn" style="background:rgba(11,143,131,.12);color:#0b8f83" onclick="openSheet('info')">👤</button>
      </div>
    </div>
    <button class="fab" id="fabBtn" onclick="toggleFab()">N</button>
  </div>

  <!-- Sheet -->
  <div id="scrim" style="display:none" class="scrim" onclick="closeSheet()"></div>
  <div id="sheet" style="display:none" class="sheet">
    <div class="sh-handle" onclick="closeSheet()"></div>
    <div class="sh-header">
      <div class="sh-title">
        <div class="sh-icon" id="shIcon"></div>
        <span id="shTitle"></span>
      </div>
      <button class="sh-close" onclick="closeSheet()">×</button>
    </div>
    <div class="sh-tabs">
      <button class="stab on" id="tabPlain" onclick="switchTab('plain')">For Patients & Family</button>
      <button class="stab" id="tabClin" onclick="switchTab('clin')">Clinical Data</button>
    </div>
    <div class="sh-body" id="shBody"></div>
  </div>
</div>

<script>
// ═══ STATE ═══
var PAT={name:'Margaret Chen',age:74,mrn:'HMC-7742901',bed:'Neuro ICU 4B',dx:'L MCA aneurysm clipping',hx:'HTN, T2DM, mild cognitive impairment',att:'Dr. C. Bowers, MD'};
var CNS=['II','III','IV','V','VI','VII','IX','X','XI','XII'];
var CNT=[
  {id:'II',prompt:'Look at the center point',act:'eyeC',dur:3200},
  {id:'III',prompt:'Look UP',act:'eyeU',dur:2800},
  {id:'IV',prompt:'Look DOWN and IN',act:'eyeDI',dur:2800},
  {id:'V',prompt:'Clench your JAW',act:'jaw',dur:3000},
  {id:'VI',prompt:'Look LEFT — then RIGHT',act:'eyeLR',dur:3500},
  {id:'VII',prompt:'SMILE widely',act:'smile',dur:3200},
  {id:'IX',prompt:'Say "AHHH"',act:'mouth',dur:2800},
  {id:'X',prompt:'SWALLOW',act:'swall',dur:2800},
  {id:'XI',prompt:'Shrug SHOULDERS',act:'shrug',dur:3200},
  {id:'XII',prompt:'Stick out TONGUE',act:'tongue',dur:3200},
];
var DATA={cnR:{},gcs:{e:'—',v:'—',m:'—',t:'—'},cam:{s:'—',r:'—',a:'—',i:'—',d:'—',al:'—'},fr:{c:'—',t:'—',g:'—',f:'—',s:'—'}};
var phase='init',cnIdx=0,fabOpen=false,activeSheet=null,activeTab='plain',sheetClosing=false;
var frame=0,eyeX=0,eyeY=0,mouthO=0,tongue=0,smile=0,jaw=0,shrug=0,brow=0;

// ═══ WEBCAM + MEDIAPIPE ═══
var C=document.getElementById('c'),X=C.getContext('2d');
var vid=document.getElementById('vid');
var cameraOn=false,holistic=null,mpReady=false,fpsCount=0,fpsTimer=Date.now(),fps=0;

function resize(){C.width=window.innerWidth;C.height=window.innerHeight;}
resize();window.addEventListener('resize',resize);

// Draw dark bg before camera starts
(function bg(){X.fillStyle='#080d16';X.fillRect(0,0,C.width,C.height);})();

async function startCam(){
  document.getElementById('nocam').style.display='none';
  document.getElementById('vid').style.display='block';
  // Load MediaPipe
  var s1=document.createElement('script');s1.src='https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js';document.head.appendChild(s1);
  var s2=document.createElement('script');s2.src='https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js';document.head.appendChild(s2);
  var s3=document.createElement('script');s3.src='https://cdn.jsdelivr.net/npm/@mediapipe/holistic/holistic.js';document.head.appendChild(s3);
  s3.onload=function(){
    holistic=new Holistic({locateFile:function(f){return'https://cdn.jsdelivr.net/npm/@mediapipe/holistic/'+f;}});
    holistic.setOptions({modelComplexity:1,smoothLandmarks:true,enableSegmentation:false,refineFaceLandmarks:false,minDetectionConfidence:.5,minTrackingConfidence:.5});
    holistic.onResults(onResults);
    var cam=new Camera(vid,{onFrame:async function(){await holistic.send({image:vid});},width:1280,height:720});
    cam.start().then(function(){cameraOn=true;document.querySelector('.cam-info').style.display='flex';runCNSequence();});
  };
}

function onResults(r){
  fpsCount++;var now=Date.now();
  if(now-fpsTimer>1000){fps=fpsCount;fpsCount=0;fpsTimer=now;}
  X.clearRect(0,0,C.width,C.height);
  if(!vid.videoWidth)return;
  // Draw mirrored video
  X.save();X.translate(C.width,0);X.scale(-1,1);
  var vr=Math.min(C.width/vid.videoWidth,C.height/vid.videoHeight);
  var vw=vid.videoWidth*vr,vh=vid.videoHeight*vr;
  var vx=(C.width-vw)/2,vy=(C.height-vh)/2;
  X.globalAlpha=.65;X.drawImage(vid,vx,vy,vw,vh);X.globalAlpha=1;X.restore();

  if(r.poseLandmarks){
    var lm=r.poseLandmarks;
    function pt(l){return{x:C.width-(vx+l.x*vw),y:vy+l.y*vh};}
    var pts=lm.map(pt);
    var bones=[[11,12],[11,13],[13,15],[12,14],[14,16],[11,23],[12,24],[23,24],[23,25],[24,26],[25,27],[26,28]];
    bones.forEach(function(b){
      var isR=[12,14,16,24,26,28].indexOf(b[0])!==-1;
      X.beginPath();X.moveTo(pts[b[0]].x,pts[b[0]].y);X.lineTo(pts[b[1]].x,pts[b[1]].y);
      X.strokeStyle=isR?'rgba(255,171,64,.85)':'rgba(29,233,182,.85)';X.lineWidth=2.5;X.lineCap='round';X.stroke();
    });
    [0,11,12,13,14,15,16,23,24,25,26,27,28].forEach(function(i){
      var isR=[12,14,16,24,26,28].indexOf(i)!==-1;
      X.beginPath();X.arc(pts[i].x,pts[i].y,5,0,Math.PI*2);
      X.fillStyle=isR?'rgba(255,171,64,.9)':'rgba(29,233,182,.9)';X.fill();
    });
  }
  if(r.faceLandmarks){
    var fl=r.faceLandmarks;
    function fp(l){return{x:C.width-(vx+l.x*vw),y:vy+l.y*vh};}
    // Face oval
    X.strokeStyle='rgba(29,233,182,.4)';X.lineWidth=1.5;X.setLineDash([5,4]);
    var oval=[10,338,297,332,284,251,389,356,454,323,361,288,397,365,379,378,400,377,152,148,176,149,150,136,172,58,132,93,234,127,162,21,54,103,67,109];
    if(oval.length&&fl[oval[0]]){
      X.beginPath();X.moveTo(fp(fl[oval[0]]).x,fp(fl[oval[0]]).y);
      oval.forEach(function(i){var p=fp(fl[i]);X.lineTo(p.x,p.y);});
      X.closePath();X.stroke();
    }
    X.setLineDash([]);
    // Eyes
    [[33,133],[362,263]].forEach(function(e,ei){
      X.strokeStyle=ei===0?'rgba(68,138,255,.7)':'rgba(68,138,255,.7)';X.lineWidth=1.5;
      if(fl[e[0]]&&fl[e[1]]){
        var p1=fp(fl[e[0]]),p2=fp(fl[e[1]]);
        X.strokeRect(Math.min(p1.x,p2.x)-10,p1.y-10,Math.abs(p1.x-p2.x)+20,20);
      }
    });
    // Key dots
    [1,4,33,133,362,263,61,291,0,17].forEach(function(i){
      if(!fl[i])return;var p=fp(fl[i]);
      X.beginPath();X.arc(p.x,p.y,2.5,0,Math.PI*2);X.fillStyle='rgba(29,233,182,.85)';X.fill();
    });
  }
  // FPS
  X.font='10px IBM Plex Mono';X.fillStyle='rgba(29,233,182,.5)';
  X.fillText('HOLISTIC • '+fps+' FPS',14,C.height-14);
  // Update data scores from face
  if(r.faceLandmarks&&cameraOn){
    if(DATA.gcs.t==='—'){DATA.gcs.e='4';DATA.gcs.v='5';DATA.gcs.m='6';DATA.gcs.t='15/15';}
  }
  if(activeSheet)renderSheet();
}

function runCNSequence(){
  var i=0;
  function next(){
    if(i>=CNT.length)return;
    var cn=CNT[i];
    showPrompt(cn.prompt,'CN '+cn.id+' — Follow the prompt');
    DATA.cnR[cn.id]='pass';
    if(activeSheet==='cn')renderSheet();
    i++;setTimeout(function(){hidePrompt();setTimeout(next,400);},cn.dur);
  }
  setTimeout(next,2000);
}

// Keep run() for CAM/Frailty sequence but skip CN/GCS (handled above)
async function run(){
  await w(38000); // after CN sequence
  DATA.cam.r='-1';DATA.cam.a='Yes';DATA.cam.i='+1';DATA.cam.d='No';DATA.cam.al='+1';DATA.cam.s='3/7';
  showAlert();if(activeSheet==='cam')renderSheet();
  await w(2000);
  DATA.fr.c='5/9';DATA.fr.t='7.8mm ↓';DATA.fr.g='14.2 kg ↓';DATA.fr.f='HIGH';DATA.fr.s='5/9';
  if(activeSheet==='fr')renderSheet();
}
run();

// ═══ ASSESSMENT SEQUENCE ═══
function w(ms){return new Promise(function(r){setTimeout(r,ms);});}
function rf(){}

async function run(){
  await w(38000);

function showPrompt(title,sub){
  var pw=document.getElementById('prompt-wrap');
  pw.innerHTML='<div class="cn-prompt"><h3>'+title+'</h3><p>'+sub+'</p></div>';
}
function hidePrompt(){document.getElementById('prompt-wrap').innerHTML='';}
function showAlert(){
  document.getElementById('alert-wrap').innerHTML='<div class="alert-strip"><div class="a-icon">🚨</div><div><div class="a-title">Delirium Alert — CAM-ICU-7: 3/7</div><div class="a-sub">Tap Delirium in menu for details & recommended actions</div></div></div>';
  var b=document.getElementById('delBtn');if(b)b.style.animation='alertPop 2s infinite';
}

// ═══ FAB ═══
function toggleFab(){
  fabOpen=!fabOpen;
  document.getElementById('fabItems').className='fab-items'+(fabOpen?' open':'');
  document.getElementById('fabBtn').textContent=fabOpen?'×':'N';
  document.getElementById('fabBtn').style.transform=fabOpen?'rotate(0deg)':'';
}

// ═══ SHEET ═══
var MENU={
  cn:{icon:'👁️',label:'Cranial Nerves',bg:'rgba(124,58,237,.12)'},
  gcs:{icon:'🧠',label:'GCS Score',bg:'rgba(37,99,235,.12)'},
  cam:{icon:'🔴',label:'Delirium Screen',bg:'rgba(220,38,38,.12)'},
  fr:{icon:'🦴',label:'Frailty Assessment',bg:'rgba(217,119,6,.12)'},
  info:{icon:'👤',label:'Patient Info',bg:'rgba(11,143,131,.12)'}
};

function openSheet(id){
  activeSheet=id;activeTab='plain';fabOpen=false;
  document.getElementById('fabItems').className='fab-items';
  document.getElementById('fabBtn').textContent='N';
  var m=MENU[id];
  document.getElementById('shIcon').textContent=m.icon;
  document.getElementById('shIcon').style.background=m.bg;
  document.getElementById('shTitle').textContent=m.label;
  document.getElementById('tabPlain').className='stab on';
  document.getElementById('tabClin').className='stab';
  var s=document.getElementById('sheet');s.style.display='flex';s.className='sheet';
  document.getElementById('scrim').style.display='block';
  renderSheet();
}
function closeSheet(){
  var s=document.getElementById('sheet');
  s.className='sheet closing';
  setTimeout(function(){s.style.display='none';activeSheet=null;},260);
  document.getElementById('scrim').style.display='none';
}
function switchTab(t){
  activeTab=t;
  document.getElementById('tabPlain').className='stab'+(t==='plain'?' on':'');
  document.getElementById('tabClin').className='stab'+(t==='clin'?' on':'');
  renderSheet();
}
function renderSheet(){
  if(!activeSheet)return;
  document.getElementById('shBody').innerHTML=activeTab==='plain'?plainHTML(activeSheet):clinHTML(activeSheet);
}

function pc(type,emoji,title,body){return'<div class="pcard '+type+'"><div class="p-emoji">'+emoji+'</div><div><div class="p-ttl">'+title+'</div><div class="p-body">'+body+'</div></div></div>';}
function ccrow(l,v,cls){return'<div class="cc-row"><span class="cc-rl">'+l+'</span><span class="cc-rv'+(cls?' '+cls:'')+'">'+v+'</span></div>';}

function plainHTML(id){
  var d=DATA,g=d.gcs,cam=d.cam,fr=d.fr,cnR=d.cnR;
  var h='<div class="pc">';
  if(id==='cn'){
    var done=Object.keys(cnR).length;
    if(done===0)h+='<div class="p-wait"><div class="p-wait-icon">👁️</div><p>We\'re about to gently check Margaret\'s eye and facial movements. She just needs to follow the prompts — it\'s completely painless.</p></div>';
    else if(done<10)h+=pc('info','👁️','Checking Eye & Facial Movements',"We're asking Margaret to move her eyes and face in different ways. This helps us make sure the nerves controlling these movements are working normally after her surgery. She's doing well — "+done+" of 10 checks complete so far.")+pc('base','💡','Did You Know?',"These checks look at 10 different nerves that control the eyes, face, and mouth. Each one takes just a few seconds.");
    else h+=pc('good','✅','All Nerve Checks Passed',"Wonderful news — all 10 of Margaret's nerve checks came back normal. Her eyes, face, and mouth movements are all responding the way we'd hope. This is a very encouraging sign for her recovery.")+pc('info','🧬','What This Means',"Having all 10 nerves respond normally means the surgery area is not affecting these important pathways. Her care team is very pleased with this result.");
  }else if(id==='gcs'){
    if(g.t==='—')h+='<div class="p-wait"><div class="p-wait-icon">🧠</div><p>We\'re about to check how alert and responsive Margaret is. This is a gentle, painless assessment.</p></div>';
    else{var n=parseInt(g.t);h+=n>=14?pc('good','✅','Margaret Is Alert & Responsive',"Great news — Margaret's alertness score is "+g.t+", which is the highest possible. She's awake, answering questions, and following instructions well. This is exactly where we want to be!"):pc('warn','⚠️','Alertness Needs Monitoring',"Margaret's alertness score is "+g.t+". Her care team is watching this carefully. Talking to her gently, using her name, and reminding her where she is really helps.");h+=pc('info','📋','What The Score Means',"This score goes from 3 (lowest) to 15 (highest). It measures how well someone's eyes, speech, and movements are responding. A score of 15 means fully alert and aware.");}
  }else if(id==='cam'){
    if(cam.s==='—')h+='<div class="p-wait"><div class="p-wait-icon">🔴</div><p>We\'re about to check whether Margaret seems confused or disoriented — this is common after brain surgery and important to catch early.</p></div>';
    else{var cn=parseInt(cam.s);h+=cn>=4?pc('alert','🚨',"Some Confusion Has Been Detected","We're seeing signs that Margaret may be feeling confused right now — doctors call this delirium. Please don't be frightened. It's actually very common after brain surgery, and her care team is already taking steps to help her feel more like herself. Talking to her calmly, using her name, and reminding her of the date and where she is can make a real difference."):pc('warn','⚠️','Mild Confusion Noted',"Margaret's confusion score is "+cam.s+"/7 — on the mild side. Her team is monitoring this closely. A calm, quiet environment and familiar voices will really help her.");h+=pc('info','💡','How You Can Help',"Try saying: 'Hi Margaret, it's [your name]. You're at the hospital, you had your surgery and you're recovering well. It's [day and time].' Gentle, calm reminders like this are genuinely therapeutic.");}
  }else if(id==='fr'){
    if(fr.s==='—')h+='<div class="p-wait"><div class="p-wait-icon">🦴</div><p>We\'re about to assess Margaret\'s overall strength and fall risk to make sure she\'s safe when moving around.</p></div>';
    else{h+=fr.f==='HIGH'?pc('alert','🚨','Please Take Extra Care Around Falls',"Margaret's results show a higher chance of falling right now. This doesn't mean something is terribly wrong — it means her body is still recovering and needs extra support. Please make sure she always has someone nearby when she moves, that her bed alarm is on, and that her call button is within reach. Her team has been notified."):pc('warn','⚠️','Some Fall Risk Noted',"Margaret needs some extra support when moving right now. Her care team has safety measures in place.");if(fr.t&&fr.t.includes('↓'))h+=pc('info','💪','Building Her Strength Back',"We noticed some muscle loss near Margaret's temples — this is called sarcopenia and can happen during a hospital stay. Extra protein in her meals and gentle physical therapy exercises will help rebuild her strength. Small steps every day add up.");h+=pc('base','🏥','What The Team Is Doing',"Margaret's physical therapist has been notified and will work with her on safe movement and strength — always at her own pace and comfort level.");}
  }else if(id==='info'){
    h+=pc('info','👤',PAT.name+', Age '+PAT.age,PAT.bed+' &bull; '+PAT.dx)+pc('base','👨‍⚕️','Attending Physician',"Margaret's care is being led by "+PAT.att+". They are happy to answer any questions about her treatment and recovery — no question is too small.")+pc('good','❤️','A Word For The Family',"Recovery from brain surgery takes time, and every patient moves at their own pace. The fact that Margaret is being monitored this closely means her team can spot and address anything early. You are in the right place.");
  }
  return h+'</div>';
}

function clinHTML(id){
  var d=DATA,g=d.gcs,cam=d.cam,fr=d.fr,cnR=d.cnR;
  var h='<div class="cc">';
  if(id==='cn'){
    var done=Object.keys(cnR).length;
    h+='<div class="ccard"><div class="cc-top"><span class="cc-lbl">Cranial Nerves II–XII</span><span class="cc-val" style="color:#7c3aed">'+done+'/10</span></div><div class="cc-bar"><div class="cc-fill" style="width:'+(done/10*100)+'%;background:#7c3aed"></div></div><div class="cn-pills">';
    CNS.forEach(function(cn){var st=cnR[cn]?'pass':'pend';h+='<div class="cnp '+st+'">CN '+cn+'</div>';});
    h+='</div></div>';
  }else if(id==='gcs'){
    h+='<div class="ccard"><div class="cc-top"><span class="cc-lbl">Glasgow Coma Scale</span><span class="cc-val" style="color:'+(g.t!=='—'?'#16a34a':'#94a3b8')+'">'+g.t+'</span></div><div class="cc-bar"><div class="cc-fill" style="width:'+(g.t!=='—'?'100':'0')+'%;background:#16a34a"></div></div>'+ccrow('Eye Opening (E)',g.e,g.e!=='—'?'g':'')+ccrow('Verbal Response (V)',g.v,g.v!=='—'?'g':'')+ccrow('Motor Response (M)',g.m,g.m!=='—'?'g':'')+'</div>';
  }else if(id==='cam'){
    h+='<div class="ccard"><div class="cc-top"><span class="cc-lbl">CAM-ICU-7</span><span class="cc-val" style="color:'+(cam.s!=='—'?'#d97706':'#94a3b8')+'">'+cam.s+'</span></div><div class="cc-bar"><div class="cc-fill" style="width:'+(cam.s!=='—'?'43':'0')+'%;background:#d97706"></div></div>'+ccrow('RASS Score',cam.r,cam.r!=='—'&&cam.r!=='0'?'a':'')+ccrow('Acute Onset',cam.a,cam.a==='Yes'?'a':'')+ccrow('Inattention',cam.i,cam.i==='+1'?'a':'')+ccrow('Disorganized',cam.d,'')+ccrow('Altered Consciousness',cam.al,cam.al==='+1'?'r':'')+'</div>';
  }else if(id==='fr'){
    h+='<div class="ccard"><div class="cc-top"><span class="cc-lbl">Frailty Assessment</span><span class="cc-val" style="color:'+(fr.s!=='—'?'#d97706':'#94a3b8')+'">'+fr.s+'</span></div><div class="cc-bar"><div class="cc-fill" style="width:'+(fr.s!=='—'?'56':'0')+'%;background:#d97706"></div></div>'+ccrow('CFS Score',fr.c,'')+ccrow('Temporalis',fr.t,fr.t&&fr.t.includes('↓')?'r':'')+ccrow('Grip Strength',fr.g,fr.g&&fr.g.includes('↓')?'r':'')+ccrow('Fall Risk',fr.f,fr.f==='HIGH'?'r':'')+'</div>';
  }else if(id==='info'){
    h+='<div class="ccard">'+ccrow('Patient',PAT.name,'')+ccrow('MRN',PAT.mrn,'')+ccrow('Age/Sex',PAT.age+'F','')+ccrow('Location',PAT.bed,'')+ccrow('Diagnosis',PAT.dx,'')+ccrow('Attending',PAT.att,'')+'</div>';
  }
  return h+'</div>';
}

// Touch-to-dismiss sheet
var touchY=0;
document.getElementById('sheet').addEventListener('touchstart',function(e){touchY=e.touches[0].clientY;});
document.getElementById('sheet').addEventListener('touchend',function(e){if(e.changedTouches[0].clientY-touchY>60)closeSheet();});
</script>
