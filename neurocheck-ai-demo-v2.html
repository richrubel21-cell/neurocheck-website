<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="theme-color" content="#ffffff"/>
<title>NeuroCheck AI — Clinical Demo</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --teal:#0b8f83;--teal2:#0d9488;--tealL:rgba(11,143,131,.1);--tealM:rgba(11,143,131,.18);
  --red:#dc2626;--redL:rgba(220,38,38,.09);
  --amber:#d97706;--amberL:rgba(217,119,6,.09);
  --green:#16a34a;--greenL:rgba(22,163,74,.09);
  --blue:#2563eb;--blueL:rgba(37,99,235,.09);
  --purple:#7c3aed;
  --tx:#0f172a;--tx2:#475569;--tx3:#94a3b8;
  --border:#e2e8f0;--border2:#cbd5e1;
  --surface:#ffffff;--surface2:#f8fafc;--bg:#f0f4f8;
  --f:'Outfit',system-ui,sans-serif;--m:'IBM Plex Mono',monospace;
  --safe-bottom:env(safe-area-inset-bottom,0px);
  --safe-top:env(safe-area-inset-top,0px);
}
html,body,#root{height:100%;overflow:hidden}
body{font-family:var(--f);background:#0a0f1a;color:var(--tx);-webkit-font-smoothing:antialiased;touch-action:manipulation}
::-webkit-scrollbar{width:3px}::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}

/* ══ ANIMATIONS ══ */
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes glow{0%,100%{box-shadow:0 0 20px rgba(11,143,131,.4),0 4px 20px rgba(0,0,0,.3)}50%{box-shadow:0 0 36px rgba(11,143,131,.7),0 4px 24px rgba(0,0,0,.3)}}
@keyframes fabSpin{from{transform:rotate(0deg)}to{transform:rotate(135deg)}}
@keyframes fabUnSpin{from{transform:rotate(135deg)}to{transform:rotate(0deg)}}
@keyframes itemPop{from{opacity:0;transform:scale(.6) translateY(10px)}to{opacity:1;transform:scale(1) translateY(0)}}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes sheetDown{from{transform:translateY(0)}to{transform:translateY(100%)}}
@keyframes fadeScrim{from{opacity:0}to{opacity:1}}
@keyframes alertPulse{0%,100%{box-shadow:0 0 0 0 rgba(220,38,38,.4)}70%{box-shadow:0 0 0 10px rgba(220,38,38,0)}}
@keyframes scanline{0%{top:-10%}100%{top:110%}}
@keyframes countUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ══ LAYOUT ══ */
.app{position:fixed;inset:0;display:flex;flex-direction:column;overflow:hidden}

/* ══ TOPBAR ══ */
.topbar{
  position:absolute;top:0;left:0;right:0;
  height:56px;padding-top:var(--safe-top);
  background:rgba(255,255,255,.92);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-bottom:1px solid rgba(255,255,255,.3);
  display:flex;align-items:center;justify-content:space-between;
  padding-left:16px;padding-right:16px;
  z-index:60;
}
.topbar-logo{display:flex;align-items:center;gap:10px}
.logo-mark{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#0b8f83,#0d9488);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:15px;color:#fff;box-shadow:0 3px 10px rgba(11,143,131,.35)}
.logo-text{font-weight:800;font-size:16px;letter-spacing:-.3px;color:var(--tx)}
.logo-text span{color:var(--teal)}
.topbar-right{display:flex;align-items:center;gap:10px}
.live-badge{display:flex;align-items:center;gap:5px;background:var(--greenL);border:1px solid rgba(22,163,74,.2);padding:4px 10px;border-radius:20px}
.live-dot{width:6px;height:6px;border-radius:50%;background:var(--green);animation:pulse 1.5s infinite}
.live-text{font-size:11px;font-weight:700;color:var(--green);font-family:var(--m)}
.patient-pill{background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:4px 12px;font-size:11px;font-weight:600;color:var(--tx2);display:flex;align-items:center;gap:5px}

/* ══ VIDEO AREA ══ */
.video-wrap{position:absolute;inset:0;background:#0a0f1a;overflow:hidden}
.video-wrap canvas{width:100%;height:100%;display:block}
.video-overlay-top{position:absolute;top:0;left:0;right:0;height:120px;background:linear-gradient(to bottom,rgba(10,15,26,.6),transparent);pointer-events:none}
.video-overlay-bottom{position:absolute;bottom:0;left:0;right:0;height:180px;background:linear-gradient(to top,rgba(10,15,26,.7),transparent);pointer-events:none}
.cam-info{position:absolute;bottom:100px;left:16px;display:flex;align-items:center;gap:6px;background:rgba(0,0,0,.5);backdrop-filter:blur(8px);padding:5px 12px;border-radius:20px;font-family:var(--m);font-size:10px;color:rgba(255,255,255,.7)}

/* ══ FAB ══ */
.fab-wrap{position:absolute;bottom:calc(28px + var(--safe-bottom));right:22px;z-index:70}
.fab{
  width:60px;height:60px;border-radius:50%;
  background:linear-gradient(135deg,#0b8f83,#0d9488);
  border:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:22px;font-weight:900;font-family:var(--f);
  animation:glow 2.5s ease-in-out infinite;
  box-shadow:0 4px 20px rgba(0,0,0,.3);
  transition:transform .15s;
  position:relative;z-index:2;
  -webkit-user-select:none;user-select:none;
}
.fab:active{transform:scale(.93)}
.fab-icon{transition:transform .3s cubic-bezier(.22,1,.36,1);font-size:20px}
.fab.open .fab-icon{transform:rotate(135deg)}

/* FAB radial menu items */
.fab-items{position:absolute;bottom:70px;right:0;display:flex;flex-direction:column;align-items:flex-end;gap:10px;pointer-events:none;opacity:0;transition:opacity .2s}
.fab-items.open{pointer-events:auto;opacity:1}
.fab-item{
  display:flex;align-items:center;gap:10px;
  opacity:0;transform:translateY(10px) scale(.9);
  transition:opacity .2s,transform .2s;
}
.fab-items.open .fab-item:nth-child(1){animation:itemPop .25s .04s cubic-bezier(.22,1,.36,1) forwards}
.fab-items.open .fab-item:nth-child(2){animation:itemPop .25s .08s cubic-bezier(.22,1,.36,1) forwards}
.fab-items.open .fab-item:nth-child(3){animation:itemPop .25s .12s cubic-bezier(.22,1,.36,1) forwards}
.fab-items.open .fab-item:nth-child(4){animation:itemPop .25s .16s cubic-bezier(.22,1,.36,1) forwards}
.fab-items.open .fab-item:nth-child(5){animation:itemPop .25s .20s cubic-bezier(.22,1,.36,1) forwards}
.fab-item-label{
  background:rgba(255,255,255,.95);
  backdrop-filter:blur(10px);
  border:1px solid var(--border);
  border-radius:10px;padding:6px 14px;
  font-size:12px;font-weight:700;color:var(--tx);
  box-shadow:0 4px 16px rgba(0,0,0,.1);
  white-space:nowrap;
}
.fab-item-btn{
  width:46px;height:46px;border-radius:50%;
  border:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  font-size:20px;
  box-shadow:0 4px 16px rgba(0,0,0,.15);
  transition:transform .15s;
  flex-shrink:0;
}
.fab-item-btn:active{transform:scale(.9)}
.fab-item-btn.has-alert{animation:alertPulse 2s infinite}

/* ══ SCRIM ══ */
.scrim{
  position:fixed;inset:0;
  background:rgba(10,15,26,.55);
  backdrop-filter:blur(2px);
  z-index:65;
  animation:fadeScrim .2s ease;
}

/* ══ BOTTOM SHEET ══ */
.sheet{
  position:fixed;bottom:0;left:0;right:0;
  z-index:70;
  background:var(--surface);
  border-radius:22px 22px 0 0;
  box-shadow:0 -8px 40px rgba(0,0,0,.18);
  max-height:80vh;
  display:flex;flex-direction:column;
  animation:sheetUp .32s cubic-bezier(.22,1,.36,1);
  padding-bottom:var(--safe-bottom);
  touch-action:none;
}
.sheet.closing{animation:sheetDown .28s cubic-bezier(.36,0,.66,0) forwards}
.sheet-handle{width:36px;height:4px;border-radius:2px;background:var(--border2);margin:10px auto 0;flex-shrink:0;cursor:pointer}
.sheet-header{padding:14px 20px 12px;border-bottom:1px solid var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:space-between}
.sheet-title{display:flex;align-items:center;gap:10px;font-size:17px;font-weight:800;color:var(--tx)}
.sheet-title-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px}
.sheet-close{width:32px;height:32px;border-radius:50%;border:1px solid var(--border);background:var(--surface2);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--tx2)}

/* Sheet tabs */
.sheet-tabs{display:flex;padding:0 20px;border-bottom:1px solid var(--border);background:var(--surface);flex-shrink:0}
.stab{flex:1;padding:12px 8px;font-size:13px;font-weight:600;color:var(--tx3);border:none;background:transparent;cursor:pointer;border-bottom:2.5px solid transparent;transition:all .15s;font-family:var(--f)}
.stab.active{color:var(--teal);border-bottom-color:var(--teal)}

.sheet-body{overflow-y:auto;-webkit-overflow-scrolling:touch;flex:1;padding:20px}

/* ══ PLAIN LANGUAGE ══ */
.plain-section{display:flex;flex-direction:column;gap:14px}
.plain-card{background:var(--surface2);border:1px solid var(--border);border-radius:16px;padding:16px;display:flex;gap:12px;align-items:flex-start}
.plain-card.good{background:var(--greenL);border-color:rgba(22,163,74,.2)}
.plain-card.warn{background:var(--amberL);border-color:rgba(217,119,6,.2)}
.plain-card.alert{background:var(--redL);border-color:rgba(220,38,38,.2)}
.plain-card.info{background:var(--blueL);border-color:rgba(37,99,235,.15)}
.plain-emoji{font-size:24px;flex-shrink:0;line-height:1.2}
.plain-text{flex:1}
.plain-text-title{font-size:14px;font-weight:700;color:var(--tx);margin-bottom:4px}
.plain-text-body{font-size:13px;color:var(--tx2);line-height:1.65}
.plain-pending{text-align:center;padding:32px 16px;color:var(--tx3);font-size:14px}
.plain-pending-icon{font-size:40px;margin-bottom:12px}

/* ══ CLINICAL SCORES ══ */
.clin-section{display:flex;flex-direction:column;gap:12px}
.clin-card{background:var(--surface2);border:1px solid var(--border);border-radius:14px;padding:14px 16px}
.clin-card-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.clin-card-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--tx3)}
.clin-card-val{font-family:var(--m);font-size:20px;font-weight:700}
.clin-bar{height:4px;border-radius:2px;background:var(--border);overflow:hidden;margin-bottom:10px}
.clin-bar-fill{height:100%;border-radius:2px;transition:width .8s cubic-bezier(.22,1,.36,1)}
.clin-row{display:flex;justify-content:space-between;align-items:center;font-size:12px;padding:5px 0;border-bottom:1px solid var(--border)}
.clin-row:last-child{border:none}
.clin-row-l{color:var(--tx2)}
.clin-row-r{font-family:var(--m);font-weight:600;color:var(--tx)}
.clin-row-r.red{color:var(--red)}
.clin-row-r.amber{color:var(--amber)}
.clin-row-r.green{color:var(--green)}

/* CN pills */
.cn-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-top:4px}
.cn-pill{padding:5px 2px;border-radius:7px;text-align:center;font-family:var(--m);font-size:9px;font-weight:600;transition:all .3s}
.cn-pill.pass{background:var(--greenL);color:var(--green);border:1px solid rgba(22,163,74,.2)}
.cn-pill.active{background:var(--amberL);color:var(--amber);border:1px solid rgba(217,119,6,.2);animation:pulse .8s infinite}
.cn-pill.pending{background:var(--surface);color:var(--tx3);border:1px solid var(--border)}

/* ══ ALERT STRIP ══ */
.alert-strip{
  position:absolute;bottom:calc(104px + var(--safe-bottom));left:16px;right:90px;
  background:rgba(220,38,38,.1);
  border:1px solid rgba(220,38,38,.3);
  backdrop-filter:blur(12px);
  border-radius:12px;padding:10px 14px;
  display:flex;align-items:center;gap:10px;
  z-index:60;animation:alertPulse 2s infinite;
}
.alert-strip-icon{font-size:18px;flex-shrink:0}
.alert-strip-text{flex:1}
.alert-strip-title{font-size:12px;font-weight:700;color:#fff}
.alert-strip-sub{font-size:10px;color:rgba(255,255,255,.7);margin-top:1px}

/* ══ DESKTOP OVERRIDE ══ */
@media(min-width:768px){
  .sheet{
    position:fixed;
    bottom:auto;left:auto;
    top:50%;right:22px;
    transform:translateY(-50%);
    width:420px;
    max-height:85vh;
    border-radius:20px;
    animation:none;
    box-shadow:0 24px 80px rgba(0,0,0,.2);
    padding-bottom:0;
  }
  .sheet.closing{animation:none;opacity:0}
  .fab-wrap{bottom:32px;right:28px}
  .fab{width:56px;height:56px}
  .alert-strip{left:80px;right:80px;bottom:120px}
  .cam-info{bottom:80px}
}
</style>
</head>
<body>
<div id="root"></div>
<script>
var e=React.createElement,H=React.useState,E=React.useEffect,R=React.useRef,C=React.useCallback;

// ═══ PATIENT ═══
// 5 Patient profiles from clinical data
var PATIENTS=[
  {name:'Margaret Thompson',age:82,sex:'F',mrn:'NCI-001',bed:'Geriatric Ward 2A',dx:'Recent fall at home',hx:'Hypertension, mild cognitive impairment, osteoporosis',att:'Dr. C. Bowers, MD',
   r:{gcs:{v:15,c:'green'},cam:{v:2,c:'yellow',st:'Mild delirium risk'},fr:{v:5,c:'yellow',fall:'High',tug:18,tmp:'Mild'},overall:'High',
    ins:['High fall risk based on mobility testing and recent fall history','Mild frailty and mild muscle wasting suggest reduced physical reserve','Mild delirium risk should be monitored for change in attention or confusion']}},
  {name:'Robert Jenkins',age:76,sex:'M',mrn:'NCI-002',bed:'Cardiology 4B',dx:'Weakness after hospital stay',hx:'Type 2 diabetes, coronary artery disease',att:'Dr. M. Moisi, MD',
   r:{gcs:{v:15,c:'green'},cam:{v:1,c:'green',st:'Minimal delirium concern'},fr:{v:4,c:'yellow',fall:'Moderate',tug:14,tmp:'None'},overall:'Moderate',
    ins:['Post-hospital weakness is contributing to moderate mobility risk','Early frailty pattern suggests need for strength and recovery monitoring','No major neurological or delirium signal detected at this time']}},
  {name:'Eleanor Davis',age:88,sex:'F',mrn:'NCI-003',bed:'Memory Care 1C',dx:'Increased confusion and slower walking',hx:"Alzheimer's disease, osteoarthritis",att:'Dr. C. Bowers, MD',
   r:{gcs:{v:14,c:'yellow'},cam:{v:4,c:'red',st:'Moderate delirium risk'},fr:{v:6,c:'red',fall:'High',tug:22,tmp:'Moderate'},overall:'High',
    ins:['Multiple high-risk findings indicate substantial fall and decline concern','Moderate delirium risk and cognitive history increase need for close observation','Frailty, gait imbalance, and muscle wasting suggest reduced resilience']}},
  {name:'James Carter',age:79,sex:'M',mrn:'NCI-004',bed:'Neuro ICU 3A',dx:'Evaluation after minor head injury',hx:'Hypertension, atrial fibrillation',att:'Dr. M. Moisi, MD',
   r:{gcs:{v:15,c:'green'},cam:{v:0,c:'green',st:'No delirium signal detected'},fr:{v:3,c:'green',fall:'Moderate',tug:12,tmp:'None'},overall:'Moderate',
    ins:['Neurological screening is reassuring following minor head injury','Mobility is fairly stable, though some fall caution remains appropriate','No delirium or major gait abnormality detected in this assessment']}},
  {name:'Linda Alvarez',age:84,sex:'F',mrn:'NCI-005',bed:'Renal Unit 2D',dx:'Weight loss and weakness',hx:'Chronic kidney disease, malnutrition risk',att:'Dr. C. Bowers, MD',
   r:{gcs:{v:15,c:'green'},cam:{v:1,c:'green',st:'Minimal delirium concern'},fr:{v:6,c:'red',fall:'High',tug:21,tmp:'Moderate'},overall:'High',
    ins:['Frailty, weakness, and nutritional decline are driving overall high risk','Mobility findings support increased concern for falls','Neurological findings are stable, but physical reserve appears reduced']}}
];
var patIdx=0;
var PAT=PATIENTS[0];
function getPAT(){return PATIENTS[patIdx];}

var CNT=[
  {id:'II',name:'Visual Acuity',prompt:'Look at the center point',act:'eyeC',dur:3200},
  {id:'III',name:'Oculomotor',prompt:'Look UP',act:'eyeU',dur:2800},
  {id:'IV',name:'Trochlear',prompt:'Look DOWN and IN',act:'eyeDI',dur:2800},
  {id:'V',name:'Trigeminal',prompt:'Clench your JAW',act:'jaw',dur:3000},
  {id:'VI',name:'Abducens',prompt:'Look LEFT then RIGHT',act:'eyeLR',dur:3500},
  {id:'VII',name:'Facial',prompt:'SMILE widely',act:'smile',dur:3200},
  {id:'IX',name:'Glossopharyngeal',prompt:'Say "AHHH"',act:'mouth',dur:2800},
  {id:'X',name:'Vagus',prompt:'SWALLOW',act:'swall',dur:2800},
  {id:'XI',name:'Accessory',prompt:'Shrug SHOULDERS',act:'shrug',dur:3200},
  {id:'XII',name:'Hypoglossal',prompt:'Stick out TONGUE',act:'tongue',dur:3200},
];

// ═══ FAB MENU ITEMS ═══
var MENU=[
  {id:'cn',   icon:'👁️', label:'Cranial Nerves', color:'#7c3aed', bg:'rgba(124,58,237,.12)'},
  {id:'gcs',  icon:'🧠', label:'GCS Score',      color:'#2563eb', bg:'rgba(37,99,235,.12)'},
  {id:'cam',  icon:'🔴', label:'Delirium',        color:'#dc2626', bg:'rgba(220,38,38,.12)'},
  {id:'fr',   icon:'🦴', label:'Frailty',         color:'#d97706', bg:'rgba(217,119,6,.12)'},
  {id:'info', icon:'👤', label:'Patient Info',    color:'#0b8f83', bg:'rgba(11,143,131,.12)'},
];

// ═══ FACE CANVAS ═══
function FaceCanvas(props){
  var cnStep=props.cnStep,phase=props.phase;
  var ref=R(null),fr=R(0),raf=R(null);
  var draw=C(function(){
    var c=ref.current;if(!c)return;
    var X=c.getContext('2d'),w=c.width,h=c.height;
    fr.current++;var t=fr.current;
    var act=cnStep>=0&&cnStep<CNT.length?CNT[cnStep].act:'idle';
    var eyeX=0,eyeY=0,mouthOpen=0,tongueOut=0,smile=0,jaw=0,shrug=0,brow=0;
    switch(act){
      case'eyeU':eyeY=-1;brow=0.3;break;case'eyeDI':eyeY=0.7;eyeX=0.3;break;
      case'jaw':jaw=1;break;case'eyeLR':eyeX=Math.sin(t*0.08);break;case'smile':smile=1;break;
      case'mouth':mouthOpen=0.7;break;case'swall':brow=Math.sin((t%50)/50*Math.PI)*0.2;break;
      case'shrug':shrug=1;break;case'tongue':mouthOpen=0.4;tongueOut=1;break;
    }
    X.clearRect(0,0,w,h);
    // Dark clinical bg
    var bg=X.createLinearGradient(0,0,0,h);bg.addColorStop(0,'#080d14');bg.addColorStop(1,'#0a1020');
    X.fillStyle=bg;X.fillRect(0,0,w,h);
    // Subtle grid
    X.globalAlpha=0.03;X.strokeStyle='#1de9b6';X.lineWidth=0.5;
    for(var i=0;i<w;i+=40){X.beginPath();X.moveTo(i,0);X.lineTo(i,h);X.stroke();}
    for(var j=0;j<h;j+=40){X.beginPath();X.moveTo(0,j);X.lineTo(w,j);X.stroke();}
    X.globalAlpha=1;
    // Scanline
    var sy=((t*2.5)%h);
    var sg=X.createLinearGradient(0,sy-40,0,sy+40);
    sg.addColorStop(0,'rgba(29,233,182,0)');sg.addColorStop(.5,'rgba(29,233,182,0.025)');sg.addColorStop(1,'rgba(29,233,182,0)');
    X.fillStyle=sg;X.fillRect(0,sy-40,w,80);
    // ICU monitor top right
    X.fillStyle='rgba(10,18,30,0.9)';X.fillRect(w-130,8,118,60);
    X.strokeStyle='rgba(29,233,182,0.25)';X.lineWidth=1;X.strokeRect(w-130,8,118,60);
    X.strokeStyle='rgba(29,233,182,0.6)';X.lineWidth=1.5;X.beginPath();
    for(var k=0;k<24;k++){var px=w-128+k*(112/24);var py=28+Math.sin((k+t*0.4)*0.5)*7+(k===10?-15:k===11?12:0);k===0?X.moveTo(px,py):X.lineTo(px,py);}
    X.stroke();
    X.font='bold 10px IBM Plex Mono';X.fillStyle='rgba(29,233,182,0.8)';X.fillText('HR 72',w-126,52);
    X.fillStyle='rgba(255,171,64,0.7)';X.fillText('SpO2 97',w-75,52);
    // Face
    var cx=w/2,cy=h*0.48,sc=Math.min(w,h)*0.28;
    X.save();X.translate(cx,cy);X.scale(sc/100,sc/100);X.translate(0,Math.sin(t*0.015)*1.5);
    // Shoulders
    var shY=190-shrug*20;
    X.beginPath();X.moveTo(-150,shY+30);X.quadraticCurveTo(-110,shY,0,shY-8);X.quadraticCurveTo(110,shY,150,shY+30);X.lineTo(150,280);X.lineTo(-150,280);X.closePath();
